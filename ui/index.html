<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Government of Bermuda</title>

    <style>
        :root {
            --navy: #10243e;
            --blue: #2b6cb0;
            --blue-light: #eaf3ff;
            --text: #172033;
            --muted: #6b7280;
            --border: #dfe5ee;
            --surface: #ffffff;
            --background: #f4f7fb;
            --shadow: 0 20px 50px rgba(16, 36, 62, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at top,
                    #ffffff 0%,
                    var(--background) 58%
                );
        }

        .page {
            min-height: 100vh;
            padding: 70px 20px;
        }

        .container {
            width: min(1040px, 100%);
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand {
            width: 74px;
            height: 74px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 23px;
            color: white;
            font-size: 32px;
            background:
                linear-gradient(
                    135deg,
                    var(--navy),
                    var(--blue)
                );
            box-shadow:
                0 15px 35px rgba(
                    16,
                    36,
                    62,
                    0.20
                );
        }

        h1 {
            margin: 0;
            color: var(--navy);
            font-size: clamp(
                34px,
                6vw,
                54px
            );
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .subtitle {
            max-width: 680px;
            margin: 14px auto 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.65;
        }

        .search-panel {
            position: relative;
            z-index: 20;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: white;
            box-shadow: var(--shadow);
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-icon {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .search-input {
            width: 100%;
            min-width: 0;
            padding: 14px 4px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: 17px;
        }

        .search-input::placeholder {
            color: #9aa3b2;
        }

        .search-button {
            flex: 0 0 auto;
            min-width: 116px;
            padding: 14px 21px;
            border: 0;
            border-radius: 16px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    var(--navy),
                    var(--blue)
                );
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .suggestions {
            display: none;
            position: absolute;
            left: 10px;
            right: 10px;
            top: calc(100% + 8px);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: white;
            box-shadow:
                0 18px 45px rgba(
                    16,
                    36,
                    62,
                    0.14
                );
        }

        .suggestions.visible {
            display: block;
        }

        .suggestion {
            width: 100%;
            padding: 14px 17px;
            border: 0;
            border-bottom: 1px solid #edf0f5;
            background: white;
            text-align: left;
            cursor: pointer;
        }

        .suggestion:last-child {
            border-bottom: 0;
        }

        .suggestion:hover {
            background: var(--blue-light);
        }

        .suggestion-title {
            display: block;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
        }

        .suggestion-meta {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        .results-area {
            margin-top: 35px;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .results-count {
            color: var(--navy);
            font-size: 15px;
            font-weight: 700;
        }

        .results-query {
            color: var(--muted);
            font-size: 14px;
        }

        .result-card {
            margin-bottom: 14px;
            padding: 23px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(
                    16,
                    36,
                    62,
                    0.055
                );
        }

        .result-type {
            display: inline-flex;
            padding: 5px 9px;
            margin-bottom: 9px;
            border-radius: 999px;
            color: var(--blue);
            background: var(--blue-light);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .result-title {
            margin: 0;
            color: var(--navy);
            font-size: 20px;
            line-height: 1.35;
        }

        .result-summary {
            margin: 10px 0 0;
            color: #596274;
            font-size: 14px;
            line-height: 1.65;
        }

        .result-agency {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .result-link {
            display: inline-flex;
            margin-top: 15px;
            color: var(--blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .empty-state,
        .loading-state {
            padding: 55px 25px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: 22px;
            background: rgba(
                255,
                255,
                255,
                0.72
            );
        }

        .empty-icon {
            margin-bottom: 12px;
            font-size: 35px;
        }

        .empty-title {
            color: var(--navy);
            font-size: 19px;
            font-weight: 800;
        }

        .empty-text {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .pagination {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 26px;
        }

        .pagination.visible {
            display: flex;
        }

        .page-button {
            min-width: 96px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            color: var(--navy);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .page-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-number {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            color: #9aa3b2;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .page {
                padding: 40px 14px 50px;
            }

            .search-form {
                gap: 5px;
            }

            .search-icon {
                width: 38px;
                flex-basis: 38px;
            }

            .search-button {
                min-width: 0;
                padding: 13px 15px;
            }

            .results-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .result-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="container">

        <section class="hero">

            <div class="brand" aria-hidden="true">
                ⚓
            </div>

            <h1>
                Government of Bermuda
            </h1>

            <p class="subtitle">
                Search the Government Knowledge Base
                for official government information,
                services, pages, articles and news.
            </p>

        </section>

        <section
            class="search-panel"
            id="searchPanel"
        >

            <form
                class="search-form"
                id="searchForm"
            >

                <div
                    class="search-icon"
                    aria-hidden="true"
                >
                    🔎
                </div>

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Search the Government of Bermuda..."
                    aria-label="Search the Government of Bermuda"
                >

                <button
                    class="search-button"
                    type="submit"
                >
                    Search
                </button>

            </form>

            <div
                id="suggestions"
                class="suggestions"
            ></div>

        </section>

        <section
            id="resultsArea"
            class="results-area"
        ></section>

        <div
            id="pagination"
            class="pagination"
        >

            <button
                id="previousButton"
                class="page-button"
                type="button"
            >
                Previous
            </button>

            <span
                id="pageNumber"
                class="page-number"
            ></span>

            <button
                id="nextButton"
                class="page-button"
                type="button"
            >
                Next
            </button>

        </div>

        <footer class="footer">
            Government of Bermuda Knowledge Base
        </footer>

    </main>

</div>

<script>
    // Unified Vercel Serverless Backend API
    const BACKEND_API = "/api/search";

    const PAGE_SIZE = 20;

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchForm =
        document.getElementById(
            "searchForm"
        );

    const suggestionsBox =
        document.getElementById(
            "suggestions"
        );

    const resultsArea =
        document.getElementById(
            "resultsArea"
        );

    const pagination =
        document.getElementById(
            "pagination"
        );

    const previousButton =
        document.getElementById(
            "previousButton"
        );

    const nextButton =
        document.getElementById(
            "nextButton"
        );

    const pageNumber =
        document.getElementById(
            "pageNumber"
        );

    let debounceTimer = null;

    let suggestionController = null;

    let searchController = null;

    let currentQuery = "";

    let currentOffset = 0;

    let currentTotal = 0;

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showSuggestions(hits) {
        if (!hits || !hits.length) {
            hideSuggestions();
            return;
        }

        suggestionsBox.innerHTML =
            hits
                .map(
                    (hit, index) => `
                        <button
                            class="suggestion"
                            type="button"
                            data-index="${index}"
                        >
                            <span class="suggestion-title">
                                ${escapeHtml(
                                    hit.title
                                )}
                            </span>

                            <span class="suggestion-meta">
                                ${escapeHtml(
                                    hit.content_type ||
                                    "record"
                                )}
                            </span>
                        </button>
                    `
                )
                .join("");

        suggestionsBox
            .querySelectorAll(
                ".suggestion"
            )
            .forEach(
                (item, index) => {
                    item.addEventListener(
                        "click",
                        () => {
                            const selected =
                                hits[index];

                            searchInput.value =
                                selected.title;

                            hideSuggestions();

                            executeSearch(
                                selected.title,
                                0
                            );
                        }
                    );
                }
            );

        suggestionsBox.classList.add(
            "visible"
        );
    }

    function hideSuggestions() {
        suggestionsBox.classList.remove(
            "visible"
        );
        suggestionsBox.innerHTML = "";
    }

    // 1. ROUTING: Fast Suggestions via mode=suggest
    async function fetchSuggestions(query) {
        const cleaned =
            query.trim();

        if (!cleaned || !/[a-zA-Z0-9]/.test(cleaned)) {
            hideSuggestions();
            return;
        }

        if (suggestionController) {
            suggestionController.abort();
        }

        suggestionController =
            new AbortController();

        try {
            const response =
                await fetch(
                    `${BACKEND_API}?q=${encodeURIComponent(cleaned)}&mode=suggest`,
                    {
                        signal:
                            suggestionController
                                .signal
                    }
                );

            if (!response.ok) {
                hideSuggestions();
                return;
            }

            const data =
                await response.json();

            if (
                searchInput.value.trim()
                !== cleaned
            ) {
                return;
            }

            showSuggestions(
                data.hits || []
            );

        } catch (error) {
            if (
                error.name !==
                "AbortError"
            ) {
                hideSuggestions();
            }
        }
    }

    function renderLoading() {
        resultsArea.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <div class="empty-title">Searching...</div>
                <div class="empty-text">Searching the knowledge base.</div>
            </div>
        `;

        pagination.classList.remove(
            "visible"
        );
    }

    function renderEmpty(query) {
        resultsArea.innerHTML = `
            <div class="empty-state">

                <div class="empty-icon">
                    🔍
                </div>

                <div class="empty-title">
                    No records found
                </div>

                <div class="empty-text">
                    No Government of Bermuda
                    Knowledge Base records matched
                    "${escapeHtml(query)}".
                </div>

            </div>
        `;

        pagination.classList.remove(
            "visible"
        );
    }

    function renderResults(data) {
        const results =
            Array.isArray(data.hits)
                ? data.hits
                : [];

        // Exact match count from the backend
        currentTotal =
            Number(
                data.totalHits !== undefined
                    ? data.totalHits
                    : results.length
            );

        if (!results.length || currentTotal === 0) {
            renderEmpty(
                data.query
            );
            return;
        }

        resultsArea.innerHTML = `
            <div class="results-header">

                <div class="results-count">
                    ${currentTotal.toLocaleString()}
                    record${currentTotal === 1 ? "" : "s"}
                    found
                </div>

                <div class="results-query">
                    Results for
                    <strong>
                        "${escapeHtml(
                            data.query
                        )}"
                    </strong>
                </div>

            </div>

            ${results
                .map(
                    result => `
                        <article class="result-card">

                            <div class="result-type">
                                ${escapeHtml(
                                    result.content_type ||
                                    "record"
                                )}
                            </div>

                            <h2 class="result-title">
                                ${escapeHtml(
                                    result.title ||
                                    "Untitled record"
                                )}
                            </h2>

                            ${
                                result.summary
                                    ? `
                                        <p class="result-summary">
                                            ${escapeHtml(
                                                result.summary
                                            )}
                                        </p>
                                    `
                                    : ""
                            }

                            ${
                                result.agency_name
                                    ? `
                                        <div class="result-agency">
                                            ${escapeHtml(
                                                result.agency_name
                                            )}
                                        </div>
                                    `
                                    : ""
                            }

                            ${
                                result.url
                                    ? `
                                        <a
                                            class="result-link"
                                            href="${escapeHtml(
                                                result.url
                                            )}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            Open record →
                                        </a>
                                    `
                                    : ""
                            }

                        </article>
                    `
                )
                .join("")}
        `;

        updatePagination();
    }

    // 2. ROUTING: True Multi-Page Pagination calculation
    function updatePagination() {
        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    currentTotal /
                    PAGE_SIZE
                )
            );

        const currentPage =
            Math.floor(
                currentOffset /
                PAGE_SIZE
            ) + 1;

        pageNumber.textContent =
            `Page ${currentPage} of ${totalPages}`;

        previousButton.disabled =
            currentOffset === 0;

        nextButton.disabled =
            currentOffset +
            PAGE_SIZE >=
            currentTotal;

        if (
            currentTotal >
            PAGE_SIZE
        ) {
            pagination.classList.add(
                "visible"
            );
        } else {
            pagination.classList.remove(
                "visible"
            );
        }
    }

    // 3. ROUTING: Full Search with offset & limit passing
    async function executeSearch(
        query,
        offset = 0
    ) {
        const cleaned =
            query.trim();

        if (!cleaned) {
            resultsArea.innerHTML = "";
            pagination.classList.remove("visible");
            return;
        }

        if (!/[a-zA-Z0-9]/.test(cleaned)) {
            hideSuggestions();
            renderEmpty(cleaned);
            return;
        }

        currentQuery = cleaned;
        currentOffset = offset;

        hideSuggestions();
        renderLoading();

        if (searchController) {
            searchController.abort();
        }

        searchController =
            new AbortController();

        try {
            // Passes offset and limit to the backend for accurate pagination
            const response =
                await fetch(
                    `${BACKEND_API}?q=${encodeURIComponent(cleaned)}&limit=${PAGE_SIZE}&offset=${offset}`,
                    {
                        signal:
                            searchController
                                .signal
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Search request failed."
                );
            }

            const data =
                await response.json();

            if (
                currentQuery !==
                cleaned
            ) {
                return;
            }

            renderResults(data);

            // Smoothly scroll back to top of results on page change
            if (offset > 0) {
                resultsArea.scrollIntoView({
                    behavior: "smooth"
                });
            }

        } catch (error) {
            if (
                error.name ===
                "AbortError"
            ) {
                return;
            }

            resultsArea.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Search unavailable</div>
                    <div class="empty-text">Could not retrieve search results.</div>
                </div>
            `;

            pagination.classList.remove("visible");
        }
    }

    // Fast 80ms typing debounce for instantaneous suggestions
    searchInput.addEventListener(
        "input",
        event => {
            const value =
                event.target.value;

            clearTimeout(
                debounceTimer
            );

            debounceTimer =
                setTimeout(
                    () => {
                        fetchSuggestions(
                            value
                        );
                    },
                    100
                );
        }
    );

    searchForm.addEventListener(
        "submit",
        event => {
            event.preventDefault();
            executeSearch(
                searchInput.value,
                0
            );
        }
    );

    // Pagination: Previous Page
    previousButton.addEventListener(
        "click",
        () => {
            if (currentOffset === 0) return;
            executeSearch(
                currentQuery,
                Math.max(0, currentOffset - PAGE_SIZE)
            );
        }
    );

    // Pagination: Next Page
    nextButton.addEventListener(
        "click",
        () => {
            if (currentOffset + PAGE_SIZE >= currentTotal) return;
            executeSearch(
                currentQuery,
                currentOffset + PAGE_SIZE
            );
        }
    );

    document.addEventListener(
        "click",
        event => {
            if (!event.target.closest(".search-panel")) {
                hideSuggestions();
            }
        }
    );
</script>

</body>
</html>
